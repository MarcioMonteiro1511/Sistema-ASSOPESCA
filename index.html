'use client'
              >
                Saída Manhã
              </button>

              <button
                onClick={() => registrar('Entrada Tarde')}
                className="bg-green-600 hover:bg-green-800 text-white p-5 rounded-2xl font-bold text-lg shadow-lg"
              >
                Entrada Tarde
              </button>

              <button
                onClick={() => registrar('Saída Tarde')}
                className="bg-green-500 hover:bg-green-700 text-white p-5 rounded-2xl font-bold text-lg shadow-lg"
              >
                Saída Tarde
              </button>
            </div>
          </div>
        </section>

        <section className="bg-white rounded-[35px] shadow-xl p-10">

          <h2 className="text-3xl font-black text-green-900 mb-8">
            Últimos Registros
          </h2>

          <div className="overflow-auto rounded-2xl border border-gray-200">

            <table className="w-full">

              <thead>
                <tr className="bg-green-900 text-white text-left">
                  <th className="p-5">Funcionário</th>
                  <th className="p-5">Tipo</th>
                  <th className="p-5">Horário</th>
                </tr>
              </thead>

              <tbody>
                {registros.map((item, index) => (
                  <tr
                    key={index}
                    className="border-b hover:bg-green-50 transition-all"
                  >
                    <td className="p-5">{item.funcionario}</td>
                    <td className="p-5">{item.tipo}</td>
                    <td className="p-5">{item.horario}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  )
}
